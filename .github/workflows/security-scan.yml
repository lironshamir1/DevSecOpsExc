name: DevSecOps Security Scan

on:
  push:
    branches: [ main, develop, claude/** ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  security-scan:
    name: Security Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Full history for SonarQube

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit safety pytest pytest-cov

      # Bandit Security Scan
      - name: Run Bandit Security Scan
        run: |
          bandit -r . -f json -o bandit-report.json || true
          bandit -r . -f txt

      - name: Check Bandit Results
        run: |
          if [ -f bandit-report.json ]; then
            python -c "
          import json
          with open('bandit-report.json', 'r') as f:
              data = json.load(f)
              high = len([x for x in data.get('results', []) if x['issue_severity'] == 'HIGH'])
              medium = len([x for x in data.get('results', []) if x['issue_severity'] == 'MEDIUM'])
              print(f'High severity issues: {high}')
              print(f'Medium severity issues: {medium}')
              if high > 0:
                  print('ERROR: High severity security issues found!')
                  exit(1)
          "
          fi

      # Safety - Dependency Vulnerability Check
      - name: Run Safety Check
        run: |
          safety check --json --output safety-report.json || true
          safety check || echo "Vulnerabilities found in dependencies"

      - name: Check Safety Results
        run: |
          if [ -f safety-report.json ]; then
            python -c "
          import json
          try:
              with open('safety-report.json', 'r') as f:
                  data = json.load(f)
                  vulns = data.get('vulnerabilities', [])
                  if vulns:
                      print(f'Found {len(vulns)} vulnerable dependencies')
                      for v in vulns[:5]:  # Show first 5
                          print(f\"- {v.get('package_name')} {v.get('analyzed_version')}: {v.get('vulnerability_id')}\")
                      exit(1)
          except:
              pass
          "
          fi

      # SonarQube Scan
      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        continue-on-error: true

      - name: SonarQube Quality Gate Check
        uses: sonarsource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        continue-on-error: true

      # Code Quality Checks
      - name: Run Pylint
        run: |
          pylint *.py --exit-zero --output-format=text | tee pylint-report.txt

      - name: Run Flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      # Unit Tests with Coverage
      - name: Run Tests with Coverage
        run: |
          pytest tests/ --cov=. --cov-report=xml --cov-report=html --cov-report=term || echo "Tests need to be implemented"

      # Secret Scanning (using gitleaks or similar)
      - name: Secret Scanning with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      # OWASP Dependency Check
      - name: OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'DevSecOps-Practice'
          path: '.'
          format: 'HTML'
          args: >
            --enableRetired
        continue-on-error: true

      # Upload Security Reports
      - name: Upload Bandit Report
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json

      - name: Upload Safety Report
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: safety-report
          path: safety-report.json

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: coverage-report
          path: htmlcov/

      # Final Security Gate
      - name: Security Gate Check
        run: |
          echo "==================================="
          echo "Security Scan Summary"
          echo "==================================="

          FAILED=0

          # Check Bandit
          if [ -f bandit-report.json ]; then
            HIGH=$(python -c "import json; data=json.load(open('bandit-report.json')); print(len([x for x in data.get('results', []) if x['issue_severity'] == 'HIGH']))")
            if [ "$HIGH" -gt "0" ]; then
              echo "❌ Bandit: $HIGH high severity issues found"
              FAILED=1
            else
              echo "✅ Bandit: No high severity issues"
            fi
          fi

          # Check Safety
          if [ -f safety-report.json ]; then
            VULNS=$(python -c "import json; data=json.load(open('safety-report.json')); print(len(data.get('vulnerabilities', [])))" 2>/dev/null || echo "0")
            if [ "$VULNS" -gt "0" ]; then
              echo "❌ Safety: $VULNS vulnerable dependencies found"
              FAILED=1
            else
              echo "✅ Safety: No vulnerable dependencies"
            fi
          fi

          echo "==================================="

          if [ $FAILED -eq 1 ]; then
            echo "🚨 Security scan FAILED - Please fix the issues above"
            exit 1
          else
            echo "✅ All security checks passed!"
          fi

  # Prisma Cloud Scan (if configured)
  prisma-cloud-scan:
    name: Prisma Cloud Security Scan
    runs-on: ubuntu-latest
    if: false  # Enable when Prisma Cloud is configured

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run Prisma Cloud Scan
        env:
          PRISMA_API_URL: ${{ secrets.PRISMA_API_URL }}
          PRISMA_ACCESS_KEY: ${{ secrets.PRISMA_ACCESS_KEY }}
          PRISMA_SECRET_KEY: ${{ secrets.PRISMA_SECRET_KEY }}
        run: |
          # Install twistcli
          curl -k -u $PRISMA_ACCESS_KEY:$PRISMA_SECRET_KEY \
            --output twistcli \
            $PRISMA_API_URL/api/v1/util/twistcli

          chmod +x twistcli

          # Scan for vulnerabilities
          ./twistcli images scan --details \
            --address $PRISMA_API_URL \
            --user $PRISMA_ACCESS_KEY \
            --password $PRISMA_SECRET_KEY \
            python:3.9

      - name: Prisma Cloud IaC Scan
        run: |
          ./twistcli iac scan \
            --address $PRISMA_API_URL \
            --user $PRISMA_ACCESS_KEY \
            --password $PRISMA_SECRET_KEY \
            .
