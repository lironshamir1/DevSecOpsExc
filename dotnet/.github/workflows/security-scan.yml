name: .NET DevSecOps Security Scan

on:
  push:
    branches: [ main, develop, claude/** ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  security-scan:
    name: Security Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '6.0.x'

      - name: Restore dependencies
        run: dotnet restore dotnet/VulnerableApp.csproj

      - name: Build
        run: dotnet build dotnet/VulnerableApp.csproj --no-restore

      - name: Test
        run: dotnet test dotnet/VulnerableApp.csproj --no-build --verbosity normal

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: SonarQube Quality Gate
        uses: sonarsource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  prisma-cloud-scan:
    name: Prisma Cloud Security Scan
    runs-on: ubuntu-latest
    needs: security-scan

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build Docker Image
        run: docker build -t vulnerable-dotnet-app:${{ github.sha }} dotnet/

      - name: Prisma Cloud Image Scan
        env:
          PRISMA_API_URL: ${{ secrets.PRISMA_API_URL }}
          PRISMA_ACCESS_KEY: ${{ secrets.PRISMA_ACCESS_KEY }}
          PRISMA_SECRET_KEY: ${{ secrets.PRISMA_SECRET_KEY }}
        run: |
          curl -k -u $PRISMA_ACCESS_KEY:$PRISMA_SECRET_KEY \
            --output twistcli \
            $PRISMA_API_URL/api/v1/util/twistcli
          chmod +x twistcli
          ./twistcli images scan --details \
            --address $PRISMA_API_URL \
            --user $PRISMA_ACCESS_KEY \
            --password $PRISMA_SECRET_KEY \
            vulnerable-dotnet-app:${{ github.sha }}

      - name: Upload Reports
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: security-reports
          path: |
            sonar-report.json
            twistcli-*.json
