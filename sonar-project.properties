# SonarQube Configuration for DevSecOps Practice Repository

# Project identification
sonar.projectKey=devsecops-practice-python
sonar.projectName=DevSecOps Practice - Python
sonar.projectVersion=1.0

# Source code location
sonar.sources=.
sonar.sourceEncoding=UTF-8

# Exclude files and directories
sonar.exclusions=\
  **/tests/**,\
  **/__pycache__/**,\
  **/venv/**,\
  **/env/**,\
  **/.pytest_cache/**,\
  **/htmlcov/**,\
  **/*.pyc

# Python specific settings
sonar.python.version=3.8,3.9,3.10,3.11

# Coverage reports
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=test-results.xml

# Test locations
sonar.tests=tests
sonar.test.inclusions=tests/**/*.py

# Quality Gate conditions (strict for security practice)
# These will fail the build if not met

# Code coverage minimum
sonar.coverage.minimum=0

# Duplicated lines
sonar.cpd.python.minimumTokens=50

# Security hotspots
sonar.qualitygate.wait=true

# Language
sonar.language=py

# Additional analysis parameters
sonar.python.pylint.reportPath=pylint-report.txt
sonar.python.bandit.reportPaths=bandit-report.json

# Security rules - enable all security-related rules
sonar.security.hotspots=true

# Issue severity thresholds
# Fail build on any blocker or critical issues
sonar.qualitygate.conditions=\
  new_security_hotspots,\
  new_vulnerabilities,\
  new_bugs

# Enable all security rules
sonar.issue.ignore.multicriteria=e1,e2

# Ignore specific rules for this training repo (optional)
# Uncomment if you want to gradually fix issues
# sonar.issue.ignore.multicriteria.e1.ruleKey=python:S1313
# sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.py

# Project description
sonar.projectDescription=Intentionally vulnerable Python application for DevSecOps training

# Links
sonar.links.homepage=https://github.com/your-org/devsecops-practice
sonar.links.ci=https://github.com/your-org/devsecops-practice/actions
sonar.links.scm=https://github.com/your-org/devsecops-practice

# Branch analysis
sonar.branch.name=main
