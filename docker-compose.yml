# VULNERABLE Docker Compose - DO NOT USE IN PRODUCTION
# This file contains intentional security misconfigurations

version: '3.8'

services:
  # Vulnerable web application
  web:
    build: .
    container_name: vulnerable-app
    ports:
      # VULNERABILITY: Exposing on all interfaces
      - "5000:5000"
    environment:
      # VULNERABILITY: Hardcoded secrets in environment
      - SECRET_KEY=hardcoded-secret-key-12345
      - DB_PASSWORD=password123
      - API_KEY=sk-1234567890abcdef
      - DEBUG=True
      - FLASK_ENV=development
    volumes:
      # VULNERABILITY: Mounting sensitive host directories
      - /etc:/host-etc:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/app
    # VULNERABILITY: Running in privileged mode
    privileged: true
    # VULNERABILITY: No resource limits
    # VULNERABILITY: Using default network (bridge)
    depends_on:
      - db
      - redis

  # Vulnerable database
  db:
    # VULNERABILITY: Using old PostgreSQL version
    image: postgres:10
    container_name: vulnerable-db
    environment:
      # VULNERABILITY: Weak password
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DB=appdb
    ports:
      # VULNERABILITY: Exposing database to host
      - "5432:5432"
    volumes:
      # VULNERABILITY: No named volume, data will be lost
      - ./data:/var/lib/postgresql/data
    # VULNERABILITY: No healthcheck
    # VULNERABILITY: Running as root

  # Vulnerable Redis
  redis:
    # VULNERABILITY: Using latest tag (unpredictable)
    image: redis:latest
    container_name: vulnerable-redis
    ports:
      # VULNERABILITY: Exposing Redis to host without password
      - "6379:6379"
    # VULNERABILITY: No password protection
    command: redis-server
    # VULNERABILITY: No persistence configured

  # Vulnerable admin interface
  adminer:
    image: adminer
    container_name: vulnerable-adminer
    ports:
      # VULNERABILITY: Exposing admin interface publicly
      - "8080:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=db
    # VULNERABILITY: No authentication required

# VULNERABILITY: Using default bridge network
# VULNERABILITY: No network isolation between services
# VULNERABILITY: No secrets management
# VULNERABILITY: No health checks
# VULNERABILITY: No resource constraints
# VULNERABILITY: No security_opt configurations
# VULNERABILITY: No read_only root filesystem
# VULNERABILITY: No capability dropping

# Additional issues:
# - No logging configuration
# - No restart policies
# - No dependency health checks
# - Services running as root
# - Unnecessary port exposures
# - No TLS/SSL configuration
